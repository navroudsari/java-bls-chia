name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64,   runner: ubuntu-24.04 }
          - { platform: linux-aarch64,  runner: ubuntu-24.04-arm }
          - { platform: macos-aarch64,  runner: macos-15 }
          - { platform: macos-x86_64,   runner: macos-15-intel }
          - { platform: windows-x86_64, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      # Builds the native library for this platform (native/build.sh) and runs the full test suite.
      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: mvn -B verify

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
        run: mvn -B verify

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/native-resources/native/
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: target/native-resources/native

      - name: Package jar with all platform libraries
        run: |
          find target/native-resources -type f | sort
          mvn -B -Dnative.skip=true package
          unzip -l target/java-bls-chia-*.jar | grep native/

      - uses: actions/upload-artifact@v4
        with:
          name: java-bls-chia
          path: target/java-bls-chia-*.jar
